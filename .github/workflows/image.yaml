---
name: image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

# Least privilege at the workflow level; jobs widen only what they need.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required for cosign keyless signing: the OIDC token IS the identity, so
      # there is no private key to leak or rotate.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: base
            suffix: ''
          - target: php
            suffix: '-php'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          flavor: |
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=sha,format=short

      # amd64 only: the php target builds against packages.sury.org, and an
      # arm64 build under QEMU takes ~20 minutes for no current consumer.
      # Add linux/arm64 here (and its mise checksum to the Dockerfile) if you
      # run arm nodes.
      # Build locally FIRST so the scan can actually gate. Scanning after the
      # push means the vulnerable image is already public and already signed by
      # the time the job goes red — a report, not a gate.
      - name: Build for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          push: false
          tags: scan-target:${{ matrix.target }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      # Runs on pull requests too, which is the point: catch it before merge.
      # Pinned by commit: upstream has dropped un-prefixed tags like 0.28.0
      # before, which failed every build at "Set up job".
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan-target:${{ matrix.target }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # Second call is nearly free — every layer is in the gha cache.
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SLSA provenance and an SBOM, attached as BuildKit in-toto
          # attestations in the OCI index. Read them with
          # `docker buildx imagetools inspect --format '{{ json .SBOM }}'` —
          # they are not cosign-attached artifacts.
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.target }}

      # Keyless signature bound to this workflow's OIDC identity. Verify with:
      #   cosign verify ghcr.io/OWNER/cyrus-agent-k8s:TAG \
      #     --certificate-identity-regexp '^https://github.com/OWNER/cyrus-agent-k8s/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE}@${DIGEST}"

  chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Lint
        run: helm lint chart/cyrus --set cyrus.baseUrl=https://example.com

      - name: Render
        run: |
          helm template cyrus chart/cyrus \
            --set cyrus.baseUrl=https://example.com \
            --set secrets.existingSecret=cyrus-secrets \
            --set repositories.demo=https://github.com/acme/demo.git \
            --set ingress.enabled=true \
            --set ingress.host=cyrus.example.com \
            --set ingress.tls.enabled=true \
            --set ingress.tls.secretName=cyrus-tls \
            > rendered.yaml

      - name: Validate against Kubernetes schemas
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.31.0 rendered.yaml

      # A rendered chart that does not set CYRUS_HOST_EXTERNAL=true produces a
      # pod nothing can reach, and the failure looks like a healthy start. Assert
      # it so a future refactor cannot quietly drop it.
      - name: Assert reachability invariant
        run: |
          grep -q 'CYRUS_HOST_EXTERNAL' rendered.yaml || {
            echo "CYRUS_HOST_EXTERNAL missing from rendered output" >&2; exit 1; }
          grep -A1 'name: CYRUS_HOST_EXTERNAL' rendered.yaml | grep -q '"true"' || {
            echo "CYRUS_HOST_EXTERNAL is not \"true\"" >&2; exit 1; }

      # The chart must not publish the config-mutation API to the internet.
      - name: Assert ingress does not expose /api
        run: |
          if grep -qE 'path: /$' rendered.yaml; then
            echo "ingress publishes / — that exposes /api/update/* and /mcp" >&2; exit 1
          fi

      # Without it upstream runs in proxy mode and answers every webhook Linear
      # sends directly with 401, while the pod looks perfectly healthy.
      - name: Assert direct Linear webhook verification
        run: |
          grep -A1 'name: LINEAR_DIRECT_WEBHOOKS' rendered.yaml | grep -q '"true"' || {
            echo "LINEAR_DIRECT_WEBHOOKS=\"true\" missing from rendered output" >&2; exit 1; }

      # Renovate bumps cyrus.version but cannot compute cyrus.integrity. A
      # mismatched pair renders fine and then crash-loops every pod on
      # "FATAL: registry metadata ... advertises integrity" (Renovate PR #2 did
      # exactly that). Fail the PR instead, with the value to paste.
      - name: Assert cyrus.integrity matches cyrus.version
        run: |
          version="$(yq '.cyrus.version' chart/cyrus/values.yaml)"
          pinned="$(yq '.cyrus.integrity' chart/cyrus/values.yaml)"
          published="$(npm view "cyrus-ai@${version}" dist.integrity)"
          [ -n "$published" ] && [ "$pinned" = "$published" ] || {
            echo "cyrus.integrity does not belong to cyrus-ai@${version}." >&2
            echo "Set chart/cyrus/values.yaml cyrus.integrity to: ${published:-<version not on npm>}" >&2
            exit 1; }

      # volumeClaimTemplates are immutable on a live StatefulSet. If they vary
      # with cyrus.version or the chart version, the first Renovate bump makes
      # every apply fail with "Forbidden: updates to statefulset spec".
      - name: Assert volumeClaimTemplates do not depend on versions
        run: |
          vct() {
            helm template cyrus chart/cyrus --set cyrus.baseUrl=https://example.com "$@" \
              | yq 'select(.kind == "StatefulSet") | .spec.volumeClaimTemplates'
          }
          a="$(vct --set cyrus.version=0.0.1)"
          b="$(vct --set cyrus.version=9.9.9)"
          [ -n "$a" ] && [ "$a" = "$b" ] || {
            echo "volumeClaimTemplates change with cyrus.version:" >&2
            diff <(printf '%s\n' "$a") <(printf '%s\n' "$b") >&2; exit 1; }
          if printf '%s\n' "$a" | grep -qE 'helm.sh/chart|app.kubernetes.io/version'; then
            echo "volumeClaimTemplates carry a version label" >&2; exit 1
          fi

      # `helm package` takes the version from Chart.yaml, not from the tag, and
      # the default image tag is v<chart version>. A tag cut without the bump
      # republishes the previous chart, pointing at the previous image.
      - name: Assert Chart.yaml version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          chart="v$(yq '.version' chart/cyrus/Chart.yaml)"
          tag="${GITHUB_REF_NAME%%-*}"
          [ "$chart" = "$tag" ] || {
            echo "tag ${GITHUB_REF_NAME} but chart/cyrus/Chart.yaml says ${chart}" >&2; exit 1; }

      # Prerelease tags (v0.1.0-rc.1) deliberately do NOT publish the chart:
      # `helm package` takes its version from Chart.yaml, not from the git tag,
      # so an rc tag would push a chart labelled 0.1.0 and the real v0.1.0
      # would then overwrite it. A prerelease tag still exercises the whole
      # image path — build, provenance, SBOM, cosign, Trivy — which is the
      # point of cutting one before burning the real version on a workflow typo.
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package, push and sign chart
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
        run: |
          helm package chart/cyrus --destination dist
          pkg=$(ls dist/*.tgz)
          out=$(helm push "$pkg" "oci://ghcr.io/${{ github.repository_owner }}/charts" 2>&1 | tee /dev/stderr)
          digest=$(echo "$out" | awk '/Digest:/ {print $2}')
          cosign sign --yes \
            "ghcr.io/${{ github.repository_owner }}/charts/cyrus@${digest}"

  # The assertions above read rendered YAML. This one runs it: the chart in
  # kind, with the image built from this commit and placeholder credentials
  # (Cyrus starts and serves without valid ones, which is why a wrong one looks
  # healthy). Nothing here reaches Linear or Anthropic.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NS: cyrus
      POD: cyrus-0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: base
          platforms: linux/amd64
          load: true
          push: false
          tags: cyrus-smoke:ci
          cache-from: type=gha,scope=base

      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: smoke

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      # --wait returns once the readiness probe passes. The kubelet probes the
      # pod IP, so that alone proves Cyrus did not bind to localhost.
      - name: Install chart
        run: |
          kind load docker-image cyrus-smoke:ci --name smoke
          kubectl create namespace "$NS"
          kubectl -n "$NS" create secret generic cyrus-secrets \
            --from-literal=CLAUDE_CODE_OAUTH_TOKEN=smoke \
            --from-literal=LINEAR_CLIENT_ID=smoke \
            --from-literal=LINEAR_CLIENT_SECRET=smoke \
            --from-literal=LINEAR_WEBHOOK_SECRET=smoke-webhook-secret \
            --from-literal=LINEAR_OAUTH_TOKEN=smoke \
            --from-literal=LINEAR_REFRESH_TOKEN=smoke
          cat > smoke-values.yaml <<'VALUES'
          image:
            repository: cyrus-smoke
            tag: ci
            pullPolicy: Never
          cyrus:
            baseUrl: https://cyrus.example.invalid
          secrets:
            existingSecret: cyrus-secrets
          persistence:
            size: 1Gi
          VALUES
          helm install cyrus chart/cyrus -n "$NS" -f smoke-values.yaml --wait --timeout 10m

      # The entrypoint installed cyrus-ai from npm, checked against
      # cyrus.integrity, before the server could answer at all.
      - name: Assert the pinned cyrus-ai version is serving
        run: |
          want="$(yq '.cyrus.version' chart/cyrus/values.yaml)"
          got="$(kubectl -n "$NS" exec "$POD" -- curl -fsS http://127.0.0.1:3456/version | jq -r .cyrus_cli_version)"
          [ "$got" = "$want" ] || { echo "serving cyrus-ai ${got}, chart pins ${want}" >&2; exit 1; }
          kubectl -n "$NS" exec "$POD" -- curl -fsS http://127.0.0.1:3456/status | grep -q '"idle"' || {
            echo "/status is not idle on a fresh pod" >&2; exit 1; }

      # Proxy mode would answer 401 "Missing Authorization header". Direct mode
      # checks the source IP first, and 127.0.0.1 is not Linear.
      - name: Assert webhooks from outside Linear's IP ranges are refused
        run: |
          code="$(kubectl -n "$NS" exec "$POD" -- curl -s -o /dev/null -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' --data '{}' http://127.0.0.1:3456/linear-webhook)"
          [ "$code" = 403 ] || { echo "expected 403 from the IP check, got ${code}" >&2; exit 1; }

      # Seeded so the restart below has something to prune: an issue folder
      # git does not track, untouched for 30 days, and a fresh one.
      - name: Seed workspaces
        run: |
          # shellcheck disable=SC2016  # expanded by the pod's shell, not the runner's
          kubectl -n "$NS" exec "$POD" -- sh -c '
            w=$CYRUS_HOME/worktrees
            mkdir -p "$w/SMOKE-1/notes" "$w/SMOKE-2"
            echo old > "$w/SMOKE-1/notes/a"; echo new > "$w/SMOKE-2/a"
            find "$w/SMOKE-1" -exec touch -d "30 days ago" {} +'

      # Rolls the pod. The preStop hook waits only while /status says "busy",
      # so an idle pod must go at once, not after drain.timeoutSeconds (45 min).
      - name: Restart with IP validation off; idle drain must not block
        run: |
          before="$(kubectl -n "$NS" get pod "$POD" -o jsonpath='{.metadata.uid}')"
          start=$(date +%s)
          helm upgrade cyrus chart/cyrus -n "$NS" -f smoke-values.yaml \
            --set-string cyrus.webhookIpValidation=false --wait --timeout 5m
          after="$(kubectl -n "$NS" get pod "$POD" -o jsonpath='{.metadata.uid}')"
          echo "rollout took $(( $(date +%s) - start ))s"
          [ "$before" != "$after" ] || { echo "pod was not replaced" >&2; exit 1; }

      - name: Assert the restart pruned only the stale workspace
        run: |
          # shellcheck disable=SC2016  # expanded by the pod's shell, not the runner's
          kubectl -n "$NS" exec "$POD" -- sh -c '
            w=$CYRUS_HOME/worktrees
            [ ! -e "$w/SMOKE-1" ] || { echo "stale SMOKE-1 was kept" >&2; exit 1; }
            [ -f "$w/SMOKE-2/a" ] || { echo "fresh SMOKE-2 was removed" >&2; exit 1; }'

      # Webhook signature: HMAC-SHA256 of the raw body with LINEAR_WEBHOOK_SECRET,
      # hex, in the linear-signature header. The 200 proves the secret travels
      # from the Secret into config.json; the 401s that nothing else gets in.
      - name: Assert webhook signature verification
        run: |
          post() {
            kubectl -n "$NS" exec "$POD" -- curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H 'Content-Type: application/json' "$@" http://127.0.0.1:3456/linear-webhook
          }
          body='{"type":"Smoke","action":"ping"}'
          sig="$(printf '%s' "$body" | openssl dgst -sha256 -hmac smoke-webhook-secret -hex | awk '{print $NF}')"
          bad="$(printf '%s' "$body" | openssl dgst -sha256 -hmac wrong -hex | awk '{print $NF}')"
          a="$(post --data "$body")"
          b="$(post -H "linear-signature: ${bad}" --data "$body")"
          c="$(post -H "linear-signature: ${sig}" --data "$body")"
          echo "unsigned=${a} wrong-key=${b} signed=${c}"
          [ "$a" = 401 ] && [ "$b" = 401 ] && [ "$c" = 200 ]

      - name: Pod state and logs
        if: always()
        run: |
          kubectl -n "$NS" get pods,pvc -o wide || true
          kubectl -n "$NS" describe pod "$POD" | tail -40 || true
          kubectl -n "$NS" logs "$POD" --tail=200 || true
          kubectl -n "$NS" logs "$POD" --previous --tail=100 2>/dev/null || true
