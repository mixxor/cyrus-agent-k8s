---
name: image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

# Least privilege at the workflow level; jobs widen only what they need.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required for cosign keyless signing: the OIDC token IS the identity, so
      # there is no private key to leak or rotate.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: base
            suffix: ''
          - target: php
            suffix: '-php'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          flavor: |
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=sha,format=short

      # amd64 only: the php target builds against packages.sury.org, and an
      # arm64 build under QEMU takes ~20 minutes for no current consumer.
      # Add linux/arm64 here (and its mise checksum to the Dockerfile) if you
      # run arm nodes.
      # Build locally FIRST so the scan can actually gate. Scanning after the
      # push means the vulnerable image is already public and already signed by
      # the time the job goes red — a report, not a gate.
      - name: Build for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          push: false
          tags: scan-target:${{ matrix.target }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      # Runs on pull requests too, which is the point: catch it before merge.
      # Pinned by commit: upstream has dropped un-prefixed tags like 0.28.0
      # before, which failed every build at "Set up job".
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan-target:${{ matrix.target }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # Second call is nearly free — every layer is in the gha cache.
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SLSA provenance and an SBOM, attached as BuildKit in-toto
          # attestations in the OCI index. Read them with
          # `docker buildx imagetools inspect --format '{{ json .SBOM }}'` —
          # they are not cosign-attached artifacts.
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.target }}

      # Keyless signature bound to this workflow's OIDC identity. Verify with:
      #   cosign verify ghcr.io/OWNER/cyrus-agent-k8s:TAG \
      #     --certificate-identity-regexp '^https://github.com/OWNER/cyrus-agent-k8s/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE}@${DIGEST}"

  chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Lint
        run: helm lint chart/cyrus --set cyrus.baseUrl=https://example.com

      - name: Render
        run: |
          helm template cyrus chart/cyrus \
            --set cyrus.baseUrl=https://example.com \
            --set secrets.existingSecret=cyrus-secrets \
            --set repositories.demo=https://github.com/acme/demo.git \
            --set ingress.enabled=true \
            --set ingress.host=cyrus.example.com \
            --set ingress.tls.enabled=true \
            --set ingress.tls.secretName=cyrus-tls \
            > rendered.yaml

      - name: Validate against Kubernetes schemas
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.31.0 rendered.yaml

      # A rendered chart that does not set CYRUS_HOST_EXTERNAL=true produces a
      # pod nothing can reach, and the failure looks like a healthy start. Assert
      # it so a future refactor cannot quietly drop it.
      - name: Assert reachability invariant
        run: |
          grep -q 'CYRUS_HOST_EXTERNAL' rendered.yaml || {
            echo "CYRUS_HOST_EXTERNAL missing from rendered output" >&2; exit 1; }
          grep -A1 'name: CYRUS_HOST_EXTERNAL' rendered.yaml | grep -q '"true"' || {
            echo "CYRUS_HOST_EXTERNAL is not \"true\"" >&2; exit 1; }

      # The chart must not publish the config-mutation API to the internet.
      - name: Assert ingress does not expose /api
        run: |
          if grep -qE 'path: /$' rendered.yaml; then
            echo "ingress publishes / — that exposes /api/update/* and /mcp" >&2; exit 1
          fi

      # Without it upstream runs in proxy mode and answers every webhook Linear
      # sends directly with 401, while the pod looks perfectly healthy.
      - name: Assert direct Linear webhook verification
        run: |
          grep -A1 'name: LINEAR_DIRECT_WEBHOOKS' rendered.yaml | grep -q '"true"' || {
            echo "LINEAR_DIRECT_WEBHOOKS=\"true\" missing from rendered output" >&2; exit 1; }

      # volumeClaimTemplates are immutable on a live StatefulSet. If they vary
      # with cyrus.version or the chart version, the first Renovate bump makes
      # every apply fail with "Forbidden: updates to statefulset spec".
      - name: Assert volumeClaimTemplates do not depend on versions
        run: |
          vct() {
            helm template cyrus chart/cyrus --set cyrus.baseUrl=https://example.com "$@" \
              | yq 'select(.kind == "StatefulSet") | .spec.volumeClaimTemplates'
          }
          a="$(vct --set cyrus.version=0.0.1)"
          b="$(vct --set cyrus.version=9.9.9)"
          [ -n "$a" ] && [ "$a" = "$b" ] || {
            echo "volumeClaimTemplates change with cyrus.version:" >&2
            diff <(printf '%s\n' "$a") <(printf '%s\n' "$b") >&2; exit 1; }
          if printf '%s\n' "$a" | grep -qE 'helm.sh/chart|app.kubernetes.io/version'; then
            echo "volumeClaimTemplates carry a version label" >&2; exit 1
          fi

      # Prerelease tags (v0.1.0-rc.1) deliberately do NOT publish the chart:
      # `helm package` takes its version from Chart.yaml, not from the git tag,
      # so an rc tag would push a chart labelled 0.1.0 and the real v0.1.0
      # would then overwrite it. A prerelease tag still exercises the whole
      # image path — build, provenance, SBOM, cosign, Trivy — which is the
      # point of cutting one before burning the real version on a workflow typo.
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package, push and sign chart
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
        run: |
          helm package chart/cyrus --destination dist
          pkg=$(ls dist/*.tgz)
          out=$(helm push "$pkg" "oci://ghcr.io/${{ github.repository_owner }}/charts" 2>&1 | tee /dev/stderr)
          digest=$(echo "$out" | awk '/Digest:/ {print $2}')
          cosign sign --yes \
            "ghcr.io/${{ github.repository_owner }}/charts/cyrus@${digest}"
