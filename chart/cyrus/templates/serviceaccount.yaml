{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cyrus.serviceAccountName" . }}
  labels:
    {{- include "cyrus.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No Role or RoleBinding ships with this chart, and none is needed: Cyrus talks
# to Linear, git forges and the model API, never to the Kubernetes API.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
