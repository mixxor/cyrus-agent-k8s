---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cyrus.fullname" . }}
  labels:
    {{- include "cyrus.labels" . | nindent 4 }}
spec:
  # Single instance by design: git worktrees are local state on a ReadWriteOnce
  # volume, and two replicas would both answer the same Linear webhook.
  replicas: 1
  serviceName: {{ include "cyrus.fullname" . }}
  selector:
    matchLabels:
      {{- include "cyrus.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "cyrus.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "cyrus.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: cyrus
          image: {{ include "cyrus.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.cyrus.serverPort }}
              protocol: TCP
          env:
            # Not optional, and not a preference. Cyrus binds to `localhost`
            # unless this is exactly "true" (WorkerService.js: isExternalHost
            # ? "0.0.0.0" : "localhost"). Without it the pod starts, logs
            # "started successfully", and is unreachable from the kubelet, the
            # Service and the Ingress alike.
            - name: CYRUS_HOST_EXTERNAL
              value: "true"
            - name: CYRUS_VERSION
              value: {{ .Values.cyrus.version | quote }}
            {{- with .Values.cyrus.integrity }}
            - name: CYRUS_INTEGRITY
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.cyrus.lockfileConfigMap }}
            - name: CYRUS_LOCKFILE
              value: /config/lock/package-lock.json
            {{- end }}
            - name: CYRUS_SERVER_PORT
              value: {{ .Values.cyrus.serverPort | quote }}
            - name: CYRUS_BASE_URL
              value: {{ required "cyrus.baseUrl is required — Linear must be able to reach ${baseUrl}/linear-webhook" .Values.cyrus.baseUrl | quote }}
            - name: CYRUS_HOME
              value: /home/cyrus/.cyrus
            - name: CYRUS_WORKTREE_MAX_AGE_DAYS
              value: {{ .Values.cyrus.worktreeMaxAgeDays | int | quote }}
            {{- with .Values.cyrus.webhookIpValidation }}
            - name: WEBHOOK_IP_VALIDATION
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.cyrus.disableRemoteSessionStore }}
            - name: CYRUS_DISABLE_REMOTE_SESSION_STORE
              value: "1"
            {{- end }}
            {{- if .Values.cyrus.disableSentry }}
            - name: CYRUS_SENTRY_DISABLED
              value: "1"
            {{- end }}
            - name: GIT_AUTHOR_NAME
              value: {{ .Values.cyrus.gitAuthorName | quote }}
            - name: GIT_AUTHOR_EMAIL
              value: {{ .Values.cyrus.gitAuthorEmail | quote }}
            {{- with include "cyrus.repoList" . }}
            - name: CYRUS_REPOS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.toolchains }}
            - name: CYRUS_TOOLCHAINS
              value: {{ join " " . | quote }}
            {{- end }}
            {{- with .Values.configSubstVars }}
            - name: CYRUS_CONFIG_SUBST_VARS
              value: {{ join " " . | quote }}
            {{- end }}
            {{- if eq .Values.llm.mode "gateway" }}
            # The Claude Agent SDK reads these two. Pointing it at the gateway
            # means the pod never sees the real Anthropic credential — a stolen
            # ANTHROPIC_AUTH_TOKEN is a virtual key you can revoke on its own.
            - name: ANTHROPIC_BASE_URL
              value: {{ include "cyrus.gatewayUrl" . | quote }}
            - name: ANTHROPIC_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.existingSecret is required when llm.mode is 'gateway'" .Values.secrets.existingSecret }}
                  key: {{ .Values.llm.gateway.virtualKeySecretKey }}
            {{- end }}
            {{- range $k, $v := .Values.cyrus.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- with .Values.secrets.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /home/cyrus/.cyrus
            - name: config
              mountPath: /config/config.json
              subPath: config.json
              readOnly: true
            {{- if .Values.scripts }}
            - name: scripts
              mountPath: /config/scripts
              readOnly: true
            {{- end }}
            {{- if .Values.cyrus.lockfileConfigMap }}
            - name: lockfile
              mountPath: /config/lock
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
            - name: xdg-config
              mountPath: /home/cyrus/.config
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # /version is unauthenticated and returns {"cyrus_cli_version": ...},
          # so it proves the HTTP stack is actually serving — a tcpSocket probe
          # would pass on a half-initialised server.
          #
          # First boot installs cyrus-ai and clones every configured repository,
          # so the startup budget is deliberately generous: 30 × 20s = 10 min.
          startupProbe:
            httpGet:
              path: /version
              port: http
            periodSeconds: 20
            failureThreshold: 30
          # Deliberately slack. /version shares an event loop with N concurrent
          # agent sessions, so a busy pod can stall it; a tight liveness probe
          # would restart the pod and destroy every worktree in flight to fix a
          # problem that was not there. 10 × 30s before that happens.
          livenessProbe:
            httpGet:
              path: /version
              port: http
            periodSeconds: 30
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /version
              port: http
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: {{ include "cyrus.fullname" . }}-config
        {{- if .Values.scripts }}
        - name: scripts
          configMap:
            name: {{ include "cyrus.fullname" . }}-scripts
        {{- end }}
        {{- with .Values.cyrus.lockfileConfigMap }}
        - name: lockfile
          configMap:
            name: {{ . }}
        {{- end }}
        - name: tmp
          emptyDir: {}
        - name: xdg-config
          emptyDir: {}
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  # volumeClaimTemplates are immutable once the StatefulSet exists. Selector
  # labels only: cyrus.labels carries the chart version and cyrus.version, and a
  # bump of either would make every later apply fail with "Forbidden: updates to
  # statefulset spec for fields other than ...". apiVersion, kind and status are
  # the values the API server fills in anyway; rendering them keeps Argo CD from
  # reporting the StatefulSet OutOfSync for ever.
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
        labels:
          {{- include "cyrus.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
        volumeMode: Filesystem
      status:
        phase: Pending
  {{- end }}
